<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>ScratchJr · אוולין</title>
  <style>
    :root {
      --motion:#4C97FF; --motion-d:#3373CC;
      --trigger:#FFBF00; --trigger-d:#E6A800;
      --looks:#9966FF; --looks-d:#774DCB;
      --end:#FF6680; --end-d:#E64D67;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; height:100%; }
    body { display:flex; justify-content:center; background:#666; font-family:Arial,"Arial Hebrew",sans-serif; color:#222; }
    .app { width:min(100vw,480px); min-height:100dvh; background:#f2f2f2; display:flex; flex-direction:column; position:relative; }
    .top { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; background:#fff; }
    h1 { margin:0; font-size:18px; }
    .ghost { border:0; background:transparent; font:inherit; font-weight:800; }
    .stage-wrap { background:#d9d9d9; padding:8px; }
    .stage { position:relative; height:240px; border:4px solid #fff; border-radius:8px; overflow:hidden; }
    .bg-sky { background:linear-gradient(#7ec8f8 0 62%, #8fd16a 62%); }
    .bg-night { background:linear-gradient(#1b2a4a 0 62%, #2f4a2a 62%); }
    .bg-beach { background:linear-gradient(#87ceeb 0 58%, #f2d38a 58%); }
    .flag {
      position:absolute; top:8px; left:8px; z-index:5;
      width:52px; height:52px; border:0; border-radius:8px;
      background:#3cb44a; color:#fff; font-size:26px; box-shadow:0 3px 0 #2d8a38;
    }
    .grid { position:absolute; inset:36px 8px 8px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); }
    .cell { border:2px dashed rgba(255,255,255,.35); border-radius:10px; }
    .sprite { position:absolute; width:70px; margin-left:-35px; z-index:3; transition:left .3s, top .3s, transform .2s; }
    .sprite img { width:100%; display:block; }
    .sprite.sel { outline:3px solid #ffbf00; outline-offset:2px; border-radius:8px; }
    .star { position:absolute; width:42px; margin-left:-21px; z-index:2; font-size:38px; line-height:1; color:#f0b429; }
    .work { flex:1; display:flex; flex-direction:column; background:#e6e6e6; min-height:0; }
    .hint { margin:6px 12px 0; font-weight:800; font-size:16px; min-height:1.3em; }
    .actors { display:flex; gap:8px; padding:6px 10px 0; align-items:center; }
    .actors button { width:48px; height:48px; border:2px solid #ccc; border-radius:10px; background:#fff; padding:2px; }
    .actors button.on { border-color:#ffbf00; }
    .actors button img { width:100%; }
    .strip {
      direction:ltr; min-height:74px; margin:6px 10px; background:#fff; border-radius:10px;
      display:flex; align-items:center; padding:8px; overflow-x:auto;
    }
    .strip.empty::before { content:"שימי בלוקים כאן"; color:#aaa; font-weight:700; }
    .cats { display:flex; gap:6px; padding:0 10px; }
    .cats button { width:34px; height:26px; border:0; border-radius:8px; }
    .cats button.on { outline:3px solid #333; }
    .palette { direction:ltr; display:flex; gap:8px; overflow-x:auto; padding:4px 10px 8px; }
    .block {
      direction:ltr; border:0; color:#fff; font-weight:800;
      min-width:72px; height:56px; padding:0 8px;
      display:inline-flex; align-items:center; justify-content:center; gap:3px;
      font-size:20px; border-radius:8px 16px 16px 14px;
    }
    .block.motion { background:var(--motion); box-shadow:0 4px 0 var(--motion-d); }
    .block.trigger { background:var(--trigger); box-shadow:0 4px 0 var(--trigger-d); color:#333; }
    .block.looks { background:var(--looks); box-shadow:0 4px 0 var(--looks-d); }
    .block.end { background:var(--end); box-shadow:0 4px 0 var(--end-d); }
    .block.in { margin-left:-6px; }
    .block.in:first-child { margin-left:0; }
    .block small { font-size:10px; }
    .say { margin:0; padding:0 12px 6px; font-weight:800; min-height:1.2em; }
    .say.good { color:#2d8a38; }
    .nextbar { padding:0 10px calc(10px + env(safe-area-inset-bottom)); }
    .next {
      width:100%; height:54px; border:0; border-radius:14px;
      background:#3cb44a; color:#fff; font:inherit; font-weight:900; font-size:20px;
    }
    .overlay {
      position:absolute; inset:0; background:rgba(242,242,242,.98); z-index:8;
      display:flex; flex-direction:column; justify-content:flex-end;
      padding:18px 14px calc(18px + env(safe-area-inset-bottom)); gap:8px;
    }
    .overlay h2 { margin:0; font-size:24px; }
    .overlay p { margin:0; font-size:16px; font-weight:700; }
    .lessons { display:flex; flex-direction:column; gap:8px; }
    .lessons button {
      text-align:right; background:#fff; border:0; border-radius:14px;
      padding:12px; font:inherit; font-weight:800; font-size:16px;
    }
    .lessons button small { display:block; color:#666; font-weight:700; }
    .lessons button:disabled { opacity:.4; }
    .bgpick { display:flex; gap:8px; padding:0 10px 6px; }
    .bgpick button { flex:1; height:36px; border:2px solid #ccc; border-radius:10px; }
    .bgpick button.on { border-color:#333; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <h1 id="title">ScratchJr</h1>
      <button class="ghost" id="homeBtn" type="button">שיעורים</button>
    </div>
    <div class="stage-wrap">
      <div class="stage bg-sky" id="stage">
        <button class="flag" id="flag" type="button">⚑</button>
        <div class="grid" id="grid"></div>
        <div class="star hidden" id="star">★</div>
        <div class="sprite" id="sp-cat" data-who="cat"><img src="img/cat.png" alt=""></div>
        <div class="sprite hidden" id="sp-dog" data-who="dog"><img src="img/dog.png" alt=""></div>
      </div>
    </div>
    <div class="work">
      <p class="hint" id="hint"></p>
      <div class="actors" id="actors"></div>
      <div class="bgpick hidden" id="bgpick">
        <button type="button" data-bg="bg-sky" class="on" style="background:linear-gradient(#7ec8f8,#8fd16a)"></button>
        <button type="button" data-bg="bg-night" style="background:linear-gradient(#1b2a4a,#2f4a2a)"></button>
        <button type="button" data-bg="bg-beach" style="background:linear-gradient(#87ceeb,#f2d38a)"></button>
      </div>
      <div class="strip empty" id="strip"></div>
      <div class="cats" id="cats"></div>
      <div class="palette" id="palette"></div>
      <p class="say" id="say"></p>
      <div class="nextbar hidden" id="nextbar">
        <button class="next" id="nextBtn" type="button">שיעור הבא</button>
      </div>
    </div>
    <div class="overlay" id="menu">
      <h2>ScratchJr</h2>
      <p>בחרי שיעור. אחרי שגומרים, לוחצים שיעור הבא.</p>
      <div class="lessons" id="lessons"></div>
    </div>
  </div>
<script>
const STORE = "evelyn-sj-v2";
const BLOCKS = {
  trigger: [{id:"flag", name:"דגל", icon:"⚑", cls:"trigger"}],
  motion: [
    {id:"right", name:"ימינה", icon:"→", cls:"motion"},
    {id:"left", name:"שמאלה", icon:"←", cls:"motion"},
    {id:"up", name:"למעלה", icon:"↑", cls:"motion"},
    {id:"down", name:"למטה", icon:"↓", cls:"motion"},
    {id:"home", name:"בית", icon:"⌂", cls:"motion"}
  ],
  looks: [
    {id:"bigger", name:"גדול", icon:"+", cls:"looks"},
    {id:"smaller", name:"קטן", icon:"−", cls:"looks"}
  ],
  end: [{id:"end", name:"סוף", icon:"■", cls:"end"}]
};
const TAB_COLORS = {trigger:"#FFBF00", motion:"#4C97FF", looks:"#9966FF", end:"#FF6680"};
const LESSONS = [
  {n:1, title:"הוראות", sub:"בלוק אחד. לחצי עליו."},
  {n:2, title:"סדר", sub:"כמה בלוקים עד הכוכב."},
  {n:3, title:"דגל ירוק", sub:"דגל בהתחלה. סוף בסוף."},
  {n:4, title:"רקע", sub:"בחרי רקע. שתי דמויות."}
];

const stage = document.getElementById("stage");
const grid = document.getElementById("grid");
const star = document.getElementById("star");
const strip = document.getElementById("strip");
const palette = document.getElementById("palette");
const catsEl = document.getElementById("cats");
const actorsEl = document.getElementById("actors");
const hint = document.getElementById("hint");
const say = document.getElementById("say");
const title = document.getElementById("title");
const menu = document.getElementById("menu");
const nextbar = document.getElementById("nextbar");
const bgpick = document.getElementById("bgpick");

let lesson = 1, tab = "motion", who = "cat", busy = false, done = false;
let state = load();
const actors = {
  cat: {col:1, row:1, scale:1, script:[]},
  dog: {col:0, row:1, scale:1, script:[]}
};

for (let i=0;i<9;i++) grid.appendChild(Object.assign(document.createElement("div"),{className:"cell"}));

function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || {unlocked:1, completed:[]}; }
  catch(e) { return {unlocked:1, completed:[]}; }
}
function save() { localStorage.setItem(STORE, JSON.stringify(state)); }
function find(id) { return Object.values(BLOCKS).flat().find(b => b.id===id); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function pos(c,r) {
  const g = grid.getBoundingClientRect(), s = stage.getBoundingClientRect();
  const cw=g.width/3, ch=g.height/3;
  return {left:(g.left-s.left)+c*cw+cw/2, top:(g.top-s.top)+r*ch+ch/2-28};
}
function drawOne(id) {
  const a = actors[id];
  const el = document.getElementById("sp-"+id);
  const p = pos(a.col, a.row);
  el.style.left = p.left+"px";
  el.style.top = p.top+"px";
  el.style.transform = "scale("+a.scale+")";
  el.classList.toggle("sel", who===id && lesson>=3);
}
function drawAll() { drawOne("cat"); drawOne("dog"); }
function placeStar(on) {
  star.classList.toggle("hidden", !on);
  if (!on) return;
  const p = pos(2,1);
  star.style.left = p.left+"px";
  star.style.top = (p.top+4)+"px";
}
function resetActors() {
  actors.cat = {col:1, row:1, scale:1, script: actors.cat.script};
  actors.dog = {col:0, row:1, scale:1, script: actors.dog.script};
  drawAll();
}
function applyTo(id, bid) {
  const a = actors[id];
  a._seen = a._seen || new Set();
  if (["right","left","up","down"].includes(bid)) a._seen.add(bid);
  if (bid==="right") a.col=Math.min(2,a.col+1);
  if (bid==="left") a.col=Math.max(0,a.col-1);
  if (bid==="up") a.row=Math.max(0,a.row-1);
  if (bid==="down") a.row=Math.min(2,a.row+1);
  if (bid==="home" || bid==="flag") { a.col = id==="dog"?0:1; a.row=1; a.scale=1; }
  if (bid==="bigger") a.scale=Math.min(1.35,a.scale+0.18);
  if (bid==="smaller") a.scale=Math.max(0.7,a.scale-0.18);
  drawOne(id);
}

function currentScript() { return actors[who].script; }
function setScript(arr) { actors[who].script = arr; }

function renderStrip() {
  const script = currentScript();
  strip.innerHTML = "";
  strip.classList.toggle("empty", !script.length);
  script.forEach((id,i) => {
    const def = find(id);
    const b = document.createElement("button");
    b.type="button"; b.className="block in "+def.cls;
    b.innerHTML = def.icon+"<small>"+def.name+"</small>";
    b.addEventListener("click", () => {
      if (lesson===1) runOne(i);
      else if (lesson===2) runScript(who, 0);
      else say.textContent = "לחצי על הדגל הירוק";
    });
    strip.appendChild(b);
  });
}
function addBlock(id) {
  if (busy) return;
  let script = currentScript().slice();
  if (lesson===1) script = [id];
  if (lesson===3 || lesson===4) {
    if (id==="flag") script = ["flag", ...script.filter(x=>x!=="flag" && x!=="end")];
    else if (id==="end") {
      script = script.filter(x=>x!=="end");
      if (!script.includes("flag")) script.unshift("flag");
      script.push("end");
    } else {
      const hasEnd = script.includes("end");
      script = script.filter(x=>x!=="end");
      if (!script.includes("flag")) script.unshift("flag");
      script.push(id);
      if (hasEnd) script.push("end");
    }
  } else {
    if (script.length>=6) return;
    script.push(id);
  }
  setScript(script);
  renderStrip();
  say.textContent = "";
  done = false;
  nextbar.classList.add("hidden");
}

async function runOne(i) {
  if (busy) return;
  busy = true;
  const id = currentScript()[i];
  applyTo(who, id);
  await sleep(280);
  busy = false;
  checkLesson();
}
async function runScript(id, from) {
  if (busy) return;
  busy = true;
  say.textContent = "";
  const a = actors[id];
  a.col = id==="dog"?0:1; a.row=1; a.scale=1; drawOne(id);
  await sleep(180);
  const steps = a.script.slice(from).filter(x => x!=="end");
  for (const bid of steps) {
    if (bid==="flag") continue;
    applyTo(id, bid);
    await sleep(420);
  }
  busy = false;
  checkLesson();
}
async function runFlag() {
  if (busy) return;
  if (lesson < 3) {
    if (lesson===2 && actors.cat.script.length) return runScript("cat", 0);
    say.textContent = "בשיעור 3 הדגל מפעיל את השורה";
    return;
  }
  const list = lesson>=3 ? ["cat","dog"].filter(id => !document.getElementById("sp-"+id).classList.contains("hidden") && actors[id].script.length) : ["cat"];
  if (!list.length) { say.textContent = "שימי דגל ואז בלוקים"; return; }
  busy = true;
  say.textContent = "";
  list.forEach(id => { actors[id].col = id==="dog"?0:1; actors[id].row=1; actors[id].scale=1; drawOne(id); });
  await sleep(180);
  const max = Math.max(...list.map(id => actors[id].script.filter(x=>x!=="flag"&&x!=="end").length));
  for (let i=0;i<max;i++) {
    for (const id of list) {
      const steps = actors[id].script.filter(x => x!=="flag" && x!=="end");
      if (i < steps.length) applyTo(id, steps[i]);
    }
    await sleep(420);
  }
  busy = false;
  checkLesson();
}

function markDone() {
  done = true;
  if (!state.completed.includes(lesson)) state.completed.push(lesson);
  state.unlocked = Math.max(state.unlocked, lesson+1, 1);
  save();
  say.className = "say good";
  nextbar.classList.remove("hidden");
  document.getElementById("nextBtn").textContent = lesson>=4 ? "סיימתי את הכל ★" : "שיעור " + (lesson+1);
}

function checkLesson() {
  if (lesson===1) {
    const need=["right","left","up","down"];
    const seen = new Set(actors.cat.script);
    // also count applied via taps - store on actor
    actors.cat._seen = actors.cat._seen || new Set();
    actors.cat.script.forEach(id => actors.cat._seen.add(id));
    const left = need.filter(id => !actors.cat._seen.has(id));
    if (!left.length) {
      say.textContent = "כל הכיוונים. יאללה הלאה.";
      markDone();
    } else {
      const names={right:"ימינה",left:"שמאלה",up:"למעלה",down:"למטה"};
      say.className="say";
      say.textContent = "עוד " + left.map(id=>names[id]).join(" · ");
    }
  }
  if (lesson===2) {
    if (actors.cat.col===2 && actors.cat.row===1) {
      say.textContent = "הגעת לכוכב.";
      markDone();
    } else {
      say.className="say";
      say.textContent = "עוד לא על הכוכב.";
    }
  }
  if (lesson===3) {
    const s = actors.cat.script;
    const ok = s[0]==="flag" && s.includes("end") && s.filter(x=>!["flag","end"].includes(x)).length>=1;
    if (ok && !done) {
      say.textContent = "דגל בהתחלה. סוף בסוף.";
      markDone();
    } else if (!done) {
      say.className="say";
      if (s[0]!=="flag") say.textContent = "שימי דגל בהתחלה";
      else if (!s.includes("end")) say.textContent = "שימי סוף בסוף";
      else say.textContent = "לחצי על הדגל הירוק";
    }
  }
  if (lesson===4) {
    const bgOk = !stage.classList.contains("bg-sky") || state._bgChanged;
    const moved = ["cat","dog"].some(id => actors[id].script.filter(x=>!["flag","end"].includes(x)).length>=1);
    if (bgOk && moved && actors.cat.script[0]==="flag") {
      say.textContent = "רקע + דמויות. מודול 1 גמור.";
      markDone();
    } else {
      say.className="say";
      if (!bgOk) say.textContent = "בחרי רקע אחר";
      else say.textContent = "תני לדמות לזוז עם הדגל";
    }
  }
}

function paintTabs() {
  const tabs = lesson===1 ? ["motion","looks"]
    : lesson===2 ? ["motion"]
    : lesson===3 ? ["trigger","motion","end"]
    : ["trigger","motion","looks","end"];
  if (!tabs.includes(tab)) tab = tabs[0];
  catsEl.innerHTML = "";
  tabs.forEach(id => {
    const b=document.createElement("button");
    b.type="button"; b.style.background=TAB_COLORS[id];
    if (id===tab) b.className="on";
    b.addEventListener("click", ()=>{ tab=id; paintTabs(); paintPalette(); });
    catsEl.appendChild(b);
  });
  paintPalette();
}
function paintPalette() {
  palette.innerHTML="";
  (BLOCKS[tab]||[]).forEach(def => {
    if (lesson===1 && def.id==="home") return;
    if (lesson===2 && def.id==="home") { /* keep home */ }
    const b=document.createElement("button");
    b.type="button"; b.className="block "+def.cls;
    b.innerHTML=def.icon+"<small>"+def.name+"</small>";
    b.addEventListener("click", ()=>addBlock(def.id));
    palette.appendChild(b);
  });
}
function paintActors() {
  actorsEl.innerHTML="";
  const showDog = lesson>=3;
  document.getElementById("sp-dog").classList.toggle("hidden", !showDog);
  [["cat","חתול"],["dog","כלב"]].forEach(([id,name]) => {
    if (id==="dog" && !showDog) return;
    const b=document.createElement("button");
    b.type="button";
    b.className = who===id ? "on" : "";
    b.innerHTML = '<img src="img/'+(id==="cat"?"cat":"dog")+'.png" alt="'+name+'">';
    b.addEventListener("click", ()=>{ who=id; renderStrip(); paintActors(); drawAll(); });
    actorsEl.appendChild(b);
  });
}

function startLesson(n) {
  if (n > state.unlocked) return;
  lesson = n;
  who = "cat";
  done = false;
  busy = false;
  actors.cat = {col:1,row:1,scale:1,script:[],_seen:new Set()};
  actors.dog = {col:0,row:1,scale:1,script:[]};
  menu.classList.add("hidden");
  nextbar.classList.add("hidden");
  say.textContent = "";
  title.textContent = "שיעור " + n;
  bgpick.classList.toggle("hidden", n!==4);
  if (n!==4) {
    stage.className = "stage bg-sky";
    state._bgChanged = false;
  }
  if (n===1) {
    hint.textContent = "שימי בלוק. לחצי עליו. נסי ארבעה כיוונים.";
    placeStar(false); tab="motion";
  } else if (n===2) {
    hint.textContent = "שימי בלוקים עד הכוכב. לחצי על הבלוק הראשון.";
    placeStar(true); tab="motion";
  } else if (n===3) {
    hint.textContent = "דגל בהתחלה. תנועה. סוף בסוף. לחצי על הדגל הירוק.";
    placeStar(false); tab="trigger";
  } else {
    hint.textContent = "בחרי רקע. תני לדמות לזוז עם הדגל.";
    placeStar(false); tab="trigger";
  }
  paintTabs();
  paintActors();
  renderStrip();
  drawAll();
}

function showMenu() {
  menu.classList.remove("hidden");
  nextbar.classList.add("hidden");
  const box = document.getElementById("lessons");
  box.innerHTML = "";
  LESSONS.forEach(L => {
    const open = L.n <= state.unlocked;
    const b = document.createElement("button");
    b.type="button"; b.disabled=!open;
    const mark = state.completed.includes(L.n) ? " ✓" : "";
    b.innerHTML = "שיעור "+L.n+" · "+L.title+mark+"<small>"+L.sub+"</small>";
    if (open) b.addEventListener("click", ()=>startLesson(L.n));
    box.appendChild(b);
  });
}

document.getElementById("homeBtn").addEventListener("click", showMenu);
document.getElementById("flag").addEventListener("click", runFlag);
document.getElementById("nextBtn").addEventListener("click", () => {
  if (lesson>=4) { showMenu(); return; }
  startLesson(lesson+1);
});
bgpick.querySelectorAll("button").forEach(btn => {
  btn.addEventListener("click", () => {
    stage.className = "stage " + btn.dataset.bg;
    state._bgChanged = true;
    bgpick.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
    btn.classList.add("on");
    say.textContent = "";
  });
});
window.addEventListener("resize", ()=>{ drawAll(); if(!star.classList.contains("hidden")) placeStar(true); });

// unlock all 4 for Evelyn's pace once any progress — start with 1, auto unlock on complete
if (!state.unlocked || state.unlocked < 1) state.unlocked = 1;
// She already finished 1–2; keep progress if present, else open through 3
if (!state.completed.length && state.unlocked < 3) state.unlocked = 3;
save();
setTimeout(()=>{ drawAll(); showMenu(); }, 40);
</script>
</body>
</html>
